<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igniter — Payload Packer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E0F;
    --surface:#14181A;
    --surface-2:#191E20;
    --line:#262C2E;
    --text:#E8E6E1;
    --muted:#5A6166;
    --accent:#FF6A2B;
    --accent-dim:#7A3A1E;
    --good:#5FBE8C;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,106,43,0.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .wrap{
    width:100%;
    max-width:560px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:28px;
  }
  .mark{ flex:0 0 auto; }
  .mark rect{ transition: fill .25s ease, opacity .25s ease; }

  .brand-text h1{
    font-family:var(--mono);
    font-weight:800;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--muted);
    font-family:var(--mono);
    letter-spacing:0.03em;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }

  .card-head{
    padding:18px 22px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    background:var(--surface-2);
  }
  .card-head .label{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .card-head .value{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent);
  }

  .card-body{ padding:26px 22px 22px; }

  .field-label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
    display:block;
    margin-bottom:10px;
  }

  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:22px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
    background:rgba(255,255,255,0.012);
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent-dim);
    background:rgba(255,106,43,0.04);
  }
  .dropzone svg{ flex:0 0 auto; color:var(--muted); }
  .dropzone.has-file svg{ color:var(--accent); }

  .dz-text .fname{
    font-family:var(--mono);
    font-size:13.5px;
    color:var(--text);
    word-break:break-all;
  }
  .dz-text .fhint{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
  }

  input[type=file]{ display:none; }

  .meta-row{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
  }
  .meta-row span b{ color:var(--text); font-weight:500; }

  button.build{
    width:100%;
    margin-top:22px;
    padding:14px 18px;
    background:var(--accent);
    color:#1A0D05;
    border:none;
    border-radius:7px;
    font-family:var(--mono);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  button.build:hover:not(:disabled){
    box-shadow:0 0 0 1px var(--accent), 0 8px 24px -8px rgba(255,106,43,0.5);
    transform:translateY(-1px);
  }
  button.build:active:not(:disabled){ transform:translateY(0); }
  button.build:disabled{
    background:var(--surface-2);
    color:var(--muted);
    cursor:not-allowed;
  }
  button.build:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .status{
    margin-top:14px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    min-height:16px;
  }
  .status.ok{ color:var(--good); }

  .foot{
    margin-top:18px;
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    font-family:var(--mono);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <svg class="mark" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="36" height="7" rx="1.5" fill="#FF6A2B"/>
      <rect x="2" y="11" width="24" height="5" rx="1.2" fill="#3A4144"/>
      <rect x="2" y="18" width="30" height="5" rx="1.2" fill="#2A3133"/>
      <rect x="2" y="25" width="18" height="5" rx="1.2" fill="#2A3133"/>
      <rect x="2" y="32" width="36" height="6" rx="1.2" fill="#1E2426"/>
    </svg>
    <div class="brand-text">
      <h1>IGNITER</h1>
      <p>SX Pro Payload Repacker</p>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="label">Custom Payload Packer</span>
      <span class="value" id="status-pill">Awaiting Input</span>
    </div>

    <div class="card-body">
      <span class="field-label">.bin File</span>

      <label class="dropzone" id="dropzone" for="fileInput">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/>
          <path d="M7 8l5-5 5 5"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        <div class="dz-text">
          <div class="fname" id="fname">Choose a .bin file…</div>
          <div class="fhint" id="fhint">Or drop it here</div>
        </div>
      </label>
      <input type="file" id="fileInput" accept=".bin,*"/>

      <div class="meta-row">
        <span>Load Addr: <b>0x40010000</b></span>
        <span id="size-meta">Size: <b>—</b></span>
      </div>

      <button class="build" id="buildBtn" onclick="build()" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        Build .dat
      </button>

      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <div class="foot">Runs Entirely In-Browser · Nothing Leaves Your Machine<br><span style="opacity:.6">Based On <a href="https://web.archive.org/web/20230605180753/https://gist.github.com/CTCaer/13c02c05daec9e674ba00ce5ac35f5be" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:underline;">CTCaer's Custom Payload Packer</a></span></div>

</div>

<script>
  const MAGIC = new TextEncoder().encode("Ignite\x00");
  const VERSION = new TextEncoder().encode("V1.0\x00\x00\x00\x00\x00");

  const fileInput = document.getElementById("fileInput");
  const dropzone = document.getElementById("dropzone");
  const fname = document.getElementById("fname");
  const fhint = document.getElementById("fhint");
  const sizeMeta = document.getElementById("size-meta");
  const buildBtn = document.getElementById("buildBtn");
  const statusPill = document.getElementById("status-pill");
  const statusMsg = document.getElementById("statusMsg");

  let selectedFile = null;

  function fmtBytes(n){
    if (n < 1024) return n + " B";
    if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
    return (n/(1024*1024)).toFixed(2) + " MB";
  }

  function setFile(file){
    selectedFile = file;
    fname.textContent = file.name;
    fhint.textContent = "Ready to pack";
    sizeMeta.innerHTML = "Size: <b>" + fmtBytes(file.size) + "</b>";
    dropzone.classList.add("has-file");
    buildBtn.disabled = false;
    statusPill.textContent = "File Loaded";
    statusMsg.textContent = "";
    statusMsg.className = "status";
  }

  fileInput.addEventListener("change", e => {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  ["dragenter","dragover"].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave","drop"].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  async function sha256(buf) {
    return new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
  }

  function u32(v) {
    const b = new ArrayBuffer(4);
    new DataView(b).setUint32(0, v, true);
    return new Uint8Array(b);
  }

  function concat(...arrays) {
    let len = arrays.reduce((a,b)=>a+b.length,0);
    let out = new Uint8Array(len);
    let offset = 0;
    for (let a of arrays) {
      out.set(a, offset);
      offset += a.length;
    }
    return out;
  }

  async function build() {
    if (!selectedFile) return;

    buildBtn.disabled = true;
    statusPill.textContent = "Packing…";
    statusMsg.textContent = "Hashing payload…";
    statusMsg.className = "status";

    try {
      const stage2 = new Uint8Array(await selectedFile.arrayBuffer());
      const stage2Hash = await sha256(stage2);

      let header = concat(
        MAGIC,
        VERSION,
        stage2Hash,
        u32(0x40010000),
        u32(stage2.length),
        u32(0),
        new Uint8Array(0xA4)
      );

      const headerHash = await sha256(header);
      header = concat(header, headerHash);

      const boot = concat(header, stage2);
      const blob = new Blob([boot], { type: "application/octet-stream" });

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "boot.dat";
      a.click();

      statusPill.textContent = "Done";
      statusMsg.textContent = "boot.dat written — " + fmtBytes(boot.length) + " total";
      statusMsg.className = "status ok";
    } catch (err) {
      statusPill.textContent = "Error";
      statusMsg.textContent = "Pack failed: " + err.message;
    } finally {
      buildBtn.disabled = false;
    }
  }
</script>

</body>
</html>
